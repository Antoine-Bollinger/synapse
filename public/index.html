<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4F5B93">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="icon" type="image/png" href="favicon.ico" />
    <title>Synapse by partez</title>
    <script defer src="https://kit.fontawesome.com/63124842e5.js" crossorigin="anonymous"></script>
    <script defer src="./js/bundle.js" type="module"></script>
</head>

<body>
    <header>
        <h1>Welcome to partez's Synapse!</h1>
    </header>
    <section class="flex_columns">
        <aside class="flex_column flex_grow_1">
            <form class="flex_column w_100">
                <div class="flex w_100">
                    <div class="flex_grow_1 w_100 group_input">
                        <select name="method">
                            <option value="GET">GET</option>
                            <option value="POST">POST</option>
                            <option value="PUT">PUT</option>
                            <option value="PATCH">PATCH</option>
                            <option value="DELETE">DELETE</option>
                        </select>
                        <input type="url" name="url" />
                        <button type="submit">SEND</button>
                    </div>
                </div>
            </form>
            <div>
                <ul class="tabs" data-target="query">
                    <li class="tab active" data-for="query">Query<sup></sup></li>
                    <li class="tab" data-for="headers">Headers<sup></sup></li>
                    <li class="tab" data-for="auth">Auth<sup></sup></li>
                    <li class="tab" data-for="body">Body<sup></sup></li>
                </ul>
            </div>
            <div id="query" class="content flex_column" data-target="query">
                <div class="title">
                    <p>Query Parameters</p>
                </div>
                <form name="query" class="flex_column">
                    <div class="w-100 group_input">
                        <input class="inputName" type="text" placeholder="parameter" />
                        <input class="inputValue" type="text" placeholder="value" />
                        <button class="danger remover"><i class="fa-regular fa-circle-xmark"></i></button>
                    </div>
                    <div class="add_row" data-template="queryTemplate">
                        <p>
                            <i class="fa-solid fa-circle-plus"></i>&nbsp;Add row
                        </p>
                    </div>
                </form>
            </div>
            <div id="headers" class="content flex_column" data-target="query" style="display:none;">
                <div class="title">
                    <p>HTTP Headers</p>
                </div>
                <form name="headers" class="flex_column">
                    <div class="w-100 group_input">
                        <input class="inputName" type="text" placeholder="header" value="Accept" />
                        <input class="inputValue" type="text" placeholder="value" value="*/*" />
                        <button class="danger remover"><i class="fa-regular fa-circle-xmark"></i></button>
                    </div>
                    <div class="w-100 group_input">
                        <input class="inputName" type="text" placeholder="header" value="Content-Type" />
                        <input class="inputValue" type="text" placeholder="value"
                            value="application/x-www-form-urlencoded" />
                        <button class="danger remover"><i class="fa-regular fa-circle-xmark"></i></button>
                    </div>
                    <div class="add_row" data-template="headersTemplate">
                        <p>
                            <i class="fa-solid fa-circle-plus"></i>&nbsp;Add row
                        </p>
                    </div>
                </form>
            </div>
            <div id="auth" class="content" data-target="query" style="display:none;">
                <form name="auth">
                    <div class="w-100 group_input">
                        <select class="inputName">
                            <option value="Bearer">Bearer</option>
                        </select>
                        <input class="inputValue" type="text" placeholder="value" />
                    </div>
                </form>
            </div>
            <div id="body" class="content flex_column" data-target="query" style="display:none;">
                <div class="title">
                    <p>Form Encoded</p>
                </div>
                <form name="body" class="flex_column">
                    <div class="w-100 group_input">
                        <input class="inputName" type="text" placeholder="name" />
                        <input class="inputValue" type="text" placeholder="value" />
                        <button class="danger remover"><i class="fa-regular fa-circle-xmark"></i></button>
                    </div>
                    <div class="add_row" data-template="bodyTemplate">
                        <p>
                            <i class="fa-solid fa-circle-plus"></i>&nbsp;Add row
                        </p>
                    </div>
                </form>
            </div>
        </aside>
        <article class="flex_column flex_grow_1">
            <div class="flex_row_start">
                <div class="status">
                    <p>Status: <span id="status"></span></p>
                </div>
                <div class="size">
                    <p>Size: <span id="size"></span></p>
                </div>
                <div class="time">
                    <p>Time: <span id="time"></span></p>
                </div>
            </div>
            <div>
                <ul class="tabs" data-target="response">
                    <li class="tab active" data-for="response">Response</li>
                    <li class="tab" data-for="headers">Headers</li>
                </ul>
            </div>
            <div id="response" class="content flex_grow_1 scroll" data-target="response"></div>
            <div id="headers" class="content flex_grow_1 scroll" data-target="response" style="display:none;"></div>
            <div id="loader" class="loader">
                <div></div>
            </div>
        </article>
    </section>
    <footer class="flex_center">
        <div>
            Coded with 💚 by <a href="mailto:abollinger@partez.net">Antoine Bollinger</a>&nbsp;|&nbsp;
            <a href="https://github.com/Antoine-Bollinger/qrcode"><i class="fa-brands fa-github"></i></a>&nbsp;|&nbsp;
            <a href="https://www.linkedin.com/in/antoinebollinger/"><i
                    class="fa-brands fa-linkedin"></i></a>&nbsp;|&nbsp;
            <a href="https://partez.net">partez.net</a>
        </div>
    </footer>
    <div class="popup">
        <div class="popup-body">
            <p class="popup-content"></p>
        </div>
    </div>
</body>

<template id="queryTemplate">
    <div class="w-100 group_input">
        <input class="inputName" type="text" placeholder="parameter" />
        <input class="inputValue" type="text" placeholder="value" />
        <button class="danger remover"><i class="fa-regular fa-circle-xmark"></i></button>
    </div>
</template>

<template id="headersTemplate">
    <div class="w-100 group_input">
        <input class="inputName" type="text" placeholder="header" />
        <input class="inputValue" type="text" placeholder="value" />
        <button class="danger remover"><i class="fa-regular fa-circle-xmark"></i></button>
    </div>
</template>

<template id="bodyTemplate">
    <div class="w-100 group_input">
        <input class="inputName" type="text" placeholder="name" />
        <input class="inputValue" type="text" placeholder="value" />
        <button class="danger remover"><i class="fa-regular fa-circle-xmark"></i></button>
    </div>
</template>

</html>
